name: Dry run
# Every scenario once, against a fresh install of the newest AUGUR release: augur's deploy test starts it
# on the runner, the seed fills it, and the suite runs (scripts/dry-run.sh). It takes about ten minutes and
# runs a pull request's own code, so it runs only when someone asks: by hand from Actions, or by adding the
# dry-run label to a pull request that changes the suite (then again on each push while the label is on).
# A pull request without the label shows this check as skipped, never as passed (CI cost rule).
on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - 'src/**'
      - 'scenarios/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dry-run.yml'
  workflow_dispatch:
    inputs:
      release:
        description: The AUGUR release to run against, such as 0.17.1-dev.97 (default the newest, dev builds included)
        required: false
permissions:
  contents: read
  # AUGUR's images, read with the job's own token: augur-run has read access in each package's settings.
  packages: read
jobs:
  dry-run:
    # Adding some other label to a pull request that has dry-run doesn't start it again.
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'dry-run') && (github.event.action != 'labeled' || github.event.label.name == 'dry-run'))
    concurrency:
      group: dry-run-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # augur is public, so the job's own read-only token finds its releases and checks it out.
      - name: Which release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.release }}
        run: |
          version=${WANT:-$(gh release list -R harry-burton-dev/augur --limit 30 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("augur@"))] | sort_by(.createdAt) | last | .tagName | ltrimstr("augur@")')}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Dry run against a fresh install of augur@$version" >> "$GITHUB_STEP_SUMMARY"
      # The release's own deploy files and seed, as a server that checked out its tag has them, with the
      # deploy test script from augur's main, as its own Deploy test workflow does.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: harry-burton-dev/augur
          ref: augur@${{ steps.release.outputs.version }}
          path: augur
          persist-credentials: false
      - name: Take the deploy test from augur's main
        working-directory: augur
        run: |
          git fetch -q --depth=1 origin main
          git checkout -q FETCH_HEAD -- infra/deploy-test.sh
      - name: Make room for the release's images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The browser that approves sign-ins
        run: pnpm exec playwright install --with-deps chromium
      # The browser test runs here, where there is a browser; the pull request check skips it.
      - run: pnpm vitest run src/browser.test.ts
      # The job's own token, read-only and gone when the job ends, as augur's Deploy test signs in. Docker
      # keeps it on the runner, where the pull request's code can read it: that is why the run needs asking.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Fresh install, seeded, every scenario once
        env:
          LOCAL_TAG: ${{ steps.release.outputs.version }}
          AUGUR_CHECKOUT: ${{ github.workspace }}/augur
          WORK: ${{ runner.temp }}/dry
          THEN: ${{ github.workspace }}/scripts/dry-run.sh
        run: augur/infra/deploy-test.sh fresh
      - name: The report
        if: always()
        run: |
          report="${{ runner.temp }}/dry/runs/dry-run/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # No report means the suite never ran or never finished, even if the install passed.
          echo "No report: the run didn't reach its end (or the deploy test didn't run THEN)." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # The summary, report, ledger and evidence; never the passwords (credentials.json).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dry-run
          path: |
            ${{ runner.temp }}/dry/runs/
            ${{ runner.temp }}/dry/.run/**/dry-run/
          if-no-files-found: ignore
          retention-days: 14
