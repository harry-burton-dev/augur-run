name: Dry run
# Every scenario once, against a fresh install of the newest AUGUR release: im-platform's deploy test
# starts it on the runner, the seed fills it, and the suite runs (scripts/dry-run.sh). It takes about ten
# minutes, so it runs only when the suite itself changes, or by hand (CI cost rule).
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scenarios/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dry-run.yml'
  workflow_dispatch:
    inputs:
      release:
        description: The AUGUR release to run against, such as 0.17.1-dev.97 (default the newest, dev builds included)
        required: false
concurrency:
  group: dry-run-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A classic token with read access to im-platform and its packages (repo, read:packages).
      IM_PLATFORM_TOKEN: ${{ secrets.IM_PLATFORM_READ_TOKEN }}
    steps:
      # Without the token there is nothing to install: the run is skipped, and says so on the pull request.
      - name: The token to read AUGUR
        id: token
        run: |
          if [ -z "$IM_PLATFORM_TOKEN" ]; then
            echo "::warning::The dry run was skipped: it needs the IM_PLATFORM_READ_TOKEN secret (a classic token with repo and read:packages that can read im-platform). A repository admin adds it in Settings → Secrets and variables → Actions."
            echo "Skipped: the IM_PLATFORM_READ_TOKEN secret isn't set, so AUGUR can't be installed here." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
      - name: Which release
        if: steps.token.outputs.ready == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.IM_PLATFORM_READ_TOKEN }}
          WANT: ${{ inputs.release }}
        run: |
          version=${WANT:-$(gh release list -R harry-burton-dev/im-platform --limit 30 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("augur@"))] | sort_by(.createdAt) | last | .tagName | ltrimstr("augur@")')}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Dry run against a fresh install of augur@$version" >> "$GITHUB_STEP_SUMMARY"
      # The release's own deploy files and seed, as a server that checked out its tag has them, with the
      # deploy test script from im-platform's main, as its own Deploy test workflow does.
      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
        with:
          repository: harry-burton-dev/im-platform
          token: ${{ secrets.IM_PLATFORM_READ_TOKEN }}
          ref: augur@${{ steps.release.outputs.version }}
          path: im-platform
      - name: Take the deploy test from im-platform's main
        if: steps.token.outputs.ready == 'true'
        working-directory: im-platform
        run: |
          git fetch -q --depth=1 origin main
          git checkout -q FETCH_HEAD -- infra/deploy-test.sh
      - name: Make room for the release's images
        if: steps.token.outputs.ready == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@v3
        if: steps.token.outputs.ready == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.IM_PLATFORM_READ_TOKEN }}
      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.token.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: The browser that approves sign-ins
        if: steps.token.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium
      # The browser test runs here, where there is a browser; the pull request check skips it.
      - if: steps.token.outputs.ready == 'true'
        run: pnpm vitest run src/browser.test.ts
      - name: Fresh install, seeded, every scenario once
        if: steps.token.outputs.ready == 'true'
        env:
          LOCAL_TAG: ${{ steps.release.outputs.version }}
          IM_PLATFORM: ${{ github.workspace }}/im-platform
          WORK: ${{ runner.temp }}/dry
          THEN: ${{ github.workspace }}/scripts/dry-run.sh
        run: im-platform/infra/deploy-test.sh fresh
      - name: The report
        if: always() && steps.token.outputs.ready == 'true'
        run: |
          report="${{ runner.temp }}/dry/runs/dry-run/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # No report means the suite never ran or never finished, even if the install passed.
          echo "No report: the run didn't reach its end (or the deploy test didn't run THEN)." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      # The summary, report, ledger and evidence; never the personas' passwords (credentials.json).
      - uses: actions/upload-artifact@v4
        if: always() && steps.token.outputs.ready == 'true'
        with:
          name: dry-run
          path: |
            ${{ runner.temp }}/dry/runs/
            ${{ runner.temp }}/dry/.run/**/dry-run/
          if-no-files-found: ignore
          retention-days: 14
